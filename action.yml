# SPDX-License-Identifier: GPL-3.0-or-later
#
# CommitBrief GitHub Action (composite). Consume from another repo with:
#   uses: CommitBrief/commitbrief-action@v1
# See README.md for inputs, permissions, and an example workflow.
name: "CommitBrief Review"
description: "LLM code review for a pull request — post inline review comments + a verdict, or gate CI on finding severity."
author: "CommitBrief"
branding:
  icon: "git-pull-request"
  color: "green"

inputs:
  version:
    description: "commitbrief CLI version to install. A release tag installs the prebuilt release binary, SHA-256-verified against the release's checksums.txt (integrity, not provenance: the manifest is unsigned). The default is the current release tag and is bumped by the CLI's release automation, so it moves only when the `v1` tag of this action is re-cut. `latest` resolves to the newest stable release on every run, so the CLI can change between two runs of the same workflow. A branch or commit SHA builds from source with `go install`, slower and unverified."
    default: "v1.21.0"
  provider:
    description: "LLM provider: anthropic | openai | gemini | deepseek | mistral | cohere | ollama."
    required: true
  api-key:
    description: "API key for the provider (pass a repository secret). Leave empty for ollama."
    required: false
    default: ""
  model:
    description: "Model override (optional; defaults to the provider's default)."
    required: false
    default: ""
  mode:
    description: "comment = post inline review comments + a verdict (uses `commitbrief remote pr`); gate = exit-code gate only (uses `commitbrief diff --fail-on`); guard = declarative policy gate (uses `commitbrief guard`; Requires CLI v1.10.0 or later)."
    default: "comment"
  request-changes-on:
    description: "comment mode: severity at or above which the GitHub verdict becomes request-changes (critical|high|medium|low). Requires CLI v1.5.0 or later to leave this empty and never request changes (the default) — the verdict is approve or comment only."
    default: ""
  fail-on:
    description: "gate mode: fail the job if a finding meets/exceeds this severity (critical|high|medium|low|info|any)."
    default: "high"
  policy:
    description: "guard mode: path to the policy file, relative to the repo root."
    required: false
    default: ".commitbrief/policy.yml"
  sarif-upload:
    description: "gate and guard modes: \"true\" writes the findings as SARIF 2.1.0 to a file instead of printing the review (gate) or the findings that breach the policy (guard) to the job log, and uploads that file to GitHub Code Scanning (needs `permissions: security-events: write`, plus `actions: read` in private repositories; Requires CLI v1.19.0 or later in gate mode, v1.21.0 or later in guard mode). \"false\" (the default) changes nothing. Ignored with a warning in comment mode."
    required: false
    default: "false"
  since-last-review:
    description: "comment mode: \"true\" reviews only the commits added since CommitBrief's last review of the pull request (passes `--since-last-review` to `commitbrief remote pr`; Requires CLI v1.20.0 or later). The CLI falls back to a full review whenever that range cannot be determined safely. \"false\" (the default) changes nothing. Ignored with a warning in gate and guard modes."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Release tag (or `latest`) -> download the prebuilt binary, verify it
    # against checksums.txt, put it on PATH (scripts/install.sh, ADR-0044).
    # Any other ref -> the script sets method=source and the two steps below
    # build it with go install. A download or checksum failure fails here and
    # never falls back to a source build.
    - name: Install commitbrief
      id: install
      shell: bash
      env:
        CB_VERSION: ${{ inputs.version }}
        # Only used to resolve `latest` against api.github.com; withheld on
        # GitHub Enterprise Server, where the job token is not a github.com
        # credential (install.sh also checks GITHUB_SERVER_URL).
        GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install.sh"

    - name: Set up Go (source build)
      if: steps.install.outputs.method == 'source'
      uses: actions/setup-go@v7
      with:
        go-version: "stable"

    - name: Install commitbrief from source
      if: steps.install.outputs.method == 'source'
      shell: bash
      env:
        CB_REF: ${{ steps.install.outputs.ref }}
      run: |
        set -euo pipefail
        go install "github.com/CommitBrief/commitbrief/cmd/commitbrief@${CB_REF}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        "$(go env GOPATH)/bin/commitbrief" --version

    - name: Review pull request
      id: review
      shell: bash
      env:
        # github.token needs `pull-requests: write` in comment mode (gh posts
        # the review). Inputs are passed as env (not interpolated into the
        # script body) to avoid shell-injection.
        GH_TOKEN: ${{ github.token }}
        CB_PROVIDER: ${{ inputs.provider }}
        CB_API_KEY: ${{ inputs.api-key }}
        CB_MODEL: ${{ inputs.model }}
        CB_MODE: ${{ inputs.mode }}
        CB_RCO: ${{ inputs.request-changes-on }}
        CB_FAILON: ${{ inputs.fail-on }}
        CB_POLICY: ${{ inputs.policy }}
        CB_SARIF: ${{ inputs.sarif-upload }}
        CB_SLR: ${{ inputs.since-last-review }}
        CB_PR: ${{ github.event.pull_request.number }}
        CB_BASE: ${{ github.event.pull_request.base.sha }}
        CB_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        # Map the key to the provider-specific env var commitbrief reads.
        case "$CB_PROVIDER" in
          anthropic) export ANTHROPIC_API_KEY="$CB_API_KEY" ;;
          openai)    export OPENAI_API_KEY="$CB_API_KEY" ;;
          gemini)    export GEMINI_API_KEY="$CB_API_KEY" ;;
          deepseek)  export DEEPSEEK_API_KEY="$CB_API_KEY" ;;
          mistral)   export MISTRAL_API_KEY="$CB_API_KEY" ;;
          cohere)    export COHERE_API_KEY="$CB_API_KEY" ;;
          ollama)    : ;;
          *) echo "::error::unknown provider '$CB_PROVIDER'"; exit 1 ;;
        esac
        export COMMITBRIEF_PROVIDER="$CB_PROVIDER"
        if [ -n "$CB_MODEL" ]; then export COMMITBRIEF_MODEL="$CB_MODEL"; fi

        if [ -z "${CB_PR:-}" ]; then
          echo "::error::no pull_request in context — run this action on a pull_request event."
          exit 1
        fi

        # sarif-upload only means something in gate and guard modes: validate
        # it there, and in comment mode just warn that it is ignored.
        if [ "$CB_MODE" = "comment" ] && [ "$CB_SARIF" != "false" ]; then
          echo "::warning::sarif-upload is only supported in gate and guard modes; ignoring it in 'comment' mode."
        fi
        if [ "$CB_MODE" = "gate" ] || [ "$CB_MODE" = "guard" ]; then
          case "$CB_SARIF" in
            true|false) ;;
            *) echo "::error::invalid sarif-upload '$CB_SARIF' (expected true|false)"; exit 1 ;;
          esac
        fi

        # since-last-review likewise only means something in comment mode.
        if [ "$CB_MODE" != "comment" ] && [ "$CB_SLR" != "false" ]; then
          echo "::warning::since-last-review is only supported in comment mode; ignoring it in '$CB_MODE' mode."
        fi

        case "$CB_MODE" in
          comment)
            case "$CB_SLR" in
              true|false) ;;
              *) echo "::error::invalid since-last-review '$CB_SLR' (expected true|false)"; exit 1 ;;
            esac
            cmd=(commitbrief remote pr "$CB_PR")
            # --request-changes-on is opt-in (ADR-0016 §5): passing it with an
            # empty value would still enable the verdict, so omit it entirely
            # when the input is blank.
            if [ -n "$CB_RCO" ]; then
              cmd+=(--request-changes-on="$CB_RCO")
            fi
            if [ "$CB_SLR" = "true" ]; then
              cmd+=(--since-last-review)
            fi
            "${cmd[@]}"
            ;;
          gate)
            if [ "$CB_SARIF" = "true" ]; then
              sarif_file="$RUNNER_TEMP/commitbrief.sarif"
              # The review renders the log before --fail-on decides the exit
              # code, so a failing gate still leaves a file to upload. Publish
              # its path on any exit, but only if a non-empty file exists: a
              # run that errors out before rendering (fail-closed) must not
              # hand an empty or stale log to Code Scanning.
              rm -f "$sarif_file"
              trap 'if [ -s "$sarif_file" ]; then echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"; fi' EXIT
              commitbrief diff "$CB_BASE...$CB_HEAD" --fail-on="$CB_FAILON" --sarif --output "$sarif_file"
            else
              commitbrief diff "$CB_BASE...$CB_HEAD" --fail-on="$CB_FAILON"
            fi
            ;;
          guard)
            if [ "$CB_SARIF" = "true" ]; then
              sarif_file="$RUNNER_TEMP/commitbrief-guard.sarif"
              # guard writes the log before the verdict decides the exit code,
              # so a breached policy still leaves a file to upload (the verdict
              # itself goes to stderr). A run that fails closed (a degraded
              # review, a missing policy) writes no file, and the trap below
              # then publishes nothing rather than an empty or stale log.
              rm -f "$sarif_file"
              trap 'if [ -s "$sarif_file" ]; then echo "sarif-file=$sarif_file" >> "$GITHUB_OUTPUT"; fi' EXIT
              commitbrief guard --diff "$CB_BASE...$CB_HEAD" --policy "$CB_POLICY" --sarif --output "$sarif_file"
            else
              commitbrief guard --diff "$CB_BASE...$CB_HEAD" --policy "$CB_POLICY"
            fi
            ;;
          *)
            echo "::error::unknown mode '$CB_MODE' (expected comment|gate|guard)"
            exit 1
            ;;
        esac

    # gate/guard mode + sarif-upload: send the log to Code Scanning, also when
    # the gate failed the job (that is when the alerts matter). Skipped on
    # cancel and when the review wrote no log. Pinned by commit SHA (v4.38.3, an
    # annotated tag resolved to its commit).
    - name: Upload SARIF to Code Scanning
      if: ${{ !cancelled() && (inputs.mode == 'gate' || inputs.mode == 'guard') && inputs.sarif-upload == 'true' && steps.review.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ steps.review.outputs.sarif-file }}
        # Matches the category the CLI stamps into the log (commitbrief/ for
        # gate, commitbrief/guard/ for guard), so the two modes never close
        # each other's alerts.
        category: ${{ inputs.mode == 'guard' && 'commitbrief/guard' || 'commitbrief' }}
        # The CLI numbers lines against the PR head (base...head), while the
        # defaults would attach them to the merge commit; point the upload at
        # the head so annotations and line hashes match.
        ref: refs/pull/${{ github.event.pull_request.number }}/head
        sha: ${{ github.event.pull_request.head.sha }}
